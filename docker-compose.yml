# Two independently-owned databases. This is the whole point of the experiment:
# there is no shared transaction boundary between Billing and Ledger, so no
# single CHECK constraint or row lock can see the aggregate.
#
# They differ in BOTH host (container) and database name. Task 10 asserts this,
# because one config typo pointing both services at the same database would turn
# every result into an artifact.
#
# Postgres 16-alpine rather than the 14 named in the plan: 14 was inferred from
# the local psql *client* version. 16-alpine is already present locally and the
# experiment depends on no version-specific behaviour.

services:
  billing-db:
    image: postgres:16-alpine
    container_name: acl-billing-db
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      # Ephemeral: every run starts from a verified clean slate. Leftover rows
      # push a sum over the ceiling regardless of concurrency.
      - /var/lib/postgresql/data

  ledger-db:
    image: postgres:16-alpine
    container_name: acl-ledger-db
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  # The coordination authority P0 introduces. It owns the compensation budget
  # across Billing and Ledger -- the thing neither of them can see.
  #
  # It has its own store deliberately. Putting the ceiling inside Billing would
  # make Billing authoritative for the aggregate and collapse the experiment
  # into a weaker single-system one.
  control-db:
    image: postgres:16-alpine
    container_name: acl-control-db
    environment:
      POSTGRES_USER: control
      POSTGRES_PASSWORD: control
      POSTGRES_DB: control
    ports:
      - "127.0.0.1:55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  # CRM holds a projection, not authoritative state. Its lag is what makes the
  # Stage 1 thesis testable: an agent reading every source available to it can
  # still hold a stale view, because one of those sources has not caught up.
  crm-db:
    image: postgres:16-alpine
    container_name: acl-crm-db
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  # Entitlements owns feature grants; Billing owns the plan. The invariant
  # "every granted feature is permitted by the current plan" therefore spans two
  # independently-owned systems -- the same shape as the compensation ceiling,
  # with no arithmetic in it at all.
  entitlements-db:
    image: postgres:16-alpine
    container_name: acl-entitlements-db
    environment:
      POSTGRES_USER: entitlements
      POSTGRES_PASSWORD: entitlements
      POSTGRES_DB: entitlements
    ports:
      - "127.0.0.1:55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entitlements -d entitlements"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  # --- observability ------------------------------------------------------
  #
  # Behind a profile, so `make up` and the test suite are unaffected: these two
  # containers are for looking at traces, not for producing any result. Start
  # them with `make observability`.
  #
  # Span export is off in the services unless OTEL_EXPORTER_OTLP_ENDPOINT is
  # set, so nothing here changes what the schedules do.
  tempo:
    image: grafana/tempo:2.5.0
    container_name: acl-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC, where the services export
      - "127.0.0.1:3200:3200"   # query API, used by Grafana and by the test
    tmpfs:
      # Tempo runs as uid 10001; a root-owned tmpfs fails with
      # "mkdir /var/tempo/blocks: permission denied" at startup.
      - /var/tempo:uid=10001,gid=10001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready | grep -q ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:11.1.0
    container_name: acl-grafana
    profiles: ["observability"]
    depends_on:
      tempo:
        condition: service_healthy
    environment:
      # Anonymous admin: this binds to 127.0.0.1 and displays synthetic data.
      # Same boundary as ADR-002 -- it does not extend past a local lab.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      # 3000 is a common default and was already taken on the dev machine;
      # 3001 keeps this out of the way of whatever else is running.
      - "127.0.0.1:3001:3000"
    tmpfs:
      - /var/lib/grafana
