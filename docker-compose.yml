# Two independently-owned databases. This is the whole point of the experiment:
# there is no shared transaction boundary between Billing and Ledger, so no
# single CHECK constraint or row lock can see the aggregate.
#
# They differ in BOTH host (container) and database name. Task 10 asserts this,
# because one config typo pointing both services at the same database would turn
# every result into an artifact.
#
# Postgres 16-alpine rather than the 14 named in the plan: 14 was inferred from
# the local psql *client* version. 16-alpine is already present locally and the
# experiment depends on no version-specific behaviour.

services:
  billing-db:
    image: postgres:16-alpine
    container_name: acl-billing-db
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      # Ephemeral: every run starts from a verified clean slate. Leftover rows
      # push a sum over the ceiling regardless of concurrency.
      - /var/lib/postgresql/data

  ledger-db:
    image: postgres:16-alpine
    container_name: acl-ledger-db
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  # The coordination authority P0 introduces. It owns the compensation budget
  # across Billing and Ledger -- the thing neither of them can see.
  #
  # It has its own store deliberately. Putting the ceiling inside Billing would
  # make Billing authoritative for the aggregate and collapse the experiment
  # into a weaker single-system one.
  control-db:
    image: postgres:16-alpine
    container_name: acl-control-db
    environment:
      POSTGRES_USER: control
      POSTGRES_PASSWORD: control
      POSTGRES_DB: control
    ports:
      - "127.0.0.1:55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  # CRM holds a projection, not authoritative state. Its lag is what makes the
  # Stage 1 thesis testable: an agent reading every source available to it can
  # still hold a stale view, because one of those sources has not caught up.
  crm-db:
    image: postgres:16-alpine
    container_name: acl-crm-db
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  # Entitlements owns feature grants; Billing owns the plan. The invariant
  # "every granted feature is permitted by the current plan" therefore spans two
  # independently-owned systems -- the same shape as the compensation ceiling,
  # with no arithmetic in it at all.
  entitlements-db:
    image: postgres:16-alpine
    container_name: acl-entitlements-db
    environment:
      POSTGRES_USER: entitlements
      POSTGRES_PASSWORD: entitlements
      POSTGRES_DB: entitlements
    ports:
      - "127.0.0.1:55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entitlements -d entitlements"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
